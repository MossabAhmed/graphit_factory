// ---------- persistence layer ----------
function useFactoryData(organizationId) {
  const [downloadsNs, setDownloadsNs] = useState(null);
  const [ready, setReady] = useState(false);
  const [usingLocal, setUsingLocal] = useState(false);
  const [error, setError] = useState("");
  const initial = {};
  COLLECTIONS.forEach((c) => (initial[c] = []));
  const [data, setData] = useState(initial);

  useEffect(() => {
    let cancelled = false;
    const loadLocal = () => {
      setUsingLocal(true);
      const loaded = {};
      COLLECTIONS.forEach((name) => { try { loaded[name] = JSON.parse(localStorage.getItem(LOCAL_PREFIX + name) || "[]"); } catch (e) { loaded[name] = []; } });
      setData(loaded);
      setReady(true);
    };
    const loadRemote = async () => {
      const { data: rows, error: queryError } = await supabaseClient.from("app_records").select("collection,id,payload").eq("organization_id", organizationId);
      if (queryError) { if (!cancelled) { setError(queryError.message); setReady(true); } return; }
      const loaded = {};
      COLLECTIONS.forEach((name) => (loaded[name] = []));
      (rows || []).forEach((row) => { if (loaded[row.collection]) loaded[row.collection].push({ id: row.id, ...(row.payload || {}) }); });
      if (!cancelled) { setData(loaded); setReady(true); }
    };
    if (!hasSupabaseConfig || !organizationId) { loadLocal(); return () => { cancelled = true; }; }
    loadRemote();
    const channel = supabaseClient.channel("factory-records-" + organizationId)
      .on("postgres_changes", { event: "*", schema: "public", table: "app_records", filter: "organization_id=eq." + organizationId }, loadRemote)
      .subscribe();
    return () => { cancelled = true; supabaseClient.removeChannel(channel); };
  }, [organizationId]);

  const saveLocal = (name, list) => { try { localStorage.setItem(LOCAL_PREFIX + name, JSON.stringify(list)); } catch (e) { console.error(e); } };

  const upsert = async (name, docObj) => {
    if (supabaseClient && organizationId) {
      const { error: upsertError } = await supabaseClient.from("app_records").upsert({ organization_id: organizationId, collection: name, id: docObj.id, payload: docObj }, { onConflict: "organization_id,collection,id" });
      if (upsertError) { setError(upsertError.message); return; }
      setData((prev) => {
        const list = prev[name] || [];
        const idx = list.findIndex((d) => d.id === docObj.id);
        const next = idx === -1 ? [docObj, ...list] : list.map((d) => (d.id === docObj.id ? docObj : d));
        return { ...prev, [name]: next };
      });
    } else {
      setData((prev) => {
        const list = prev[name] || [];
        const idx = list.findIndex((d) => d.id === docObj.id);
        const next = idx === -1 ? [docObj, ...list] : list.map((d) => (d.id === docObj.id ? docObj : d));
        saveLocal(name, next);
        return { ...prev, [name]: next };
      });
    }
  };
  const remove = async (name, id) => {
    if (supabaseClient && organizationId) {
      const { error: deleteError } = await supabaseClient.from("app_records").delete().eq("organization_id", organizationId).eq("collection", name).eq("id", id);
      if (deleteError) { setError(deleteError.message); return; }
      setData((prev) => ({ ...prev, [name]: (prev[name] || []).filter((d) => d.id !== id) }));
    } else {
      setData((prev) => { const next = (prev[name] || []).filter((d) => d.id !== id); saveLocal(name, next); return { ...prev, [name]: next }; });
    }
  };

  return { ready, usingLocal, data, upsert, remove, downloadsNs, error };
}

  const wb = XLSX.utils.book_new();
  const sheets = {

    "بضاعة المشاريع": data.projects.flatMap((p) => (p.items || []).map((i) => ({ الزبون: p.customerName, الاتجاه: i.direction, المادة: i.name, الكمية: i.quantity, الوحدة: i.unit, التاريخ: i.date }))),

    "الفواتير": data.invoices.map((i) => ({ "رقم الفاتورة": i.invoiceNumber || "", النوع: i.type, المورد: i.supplierName || "", المبلغ: i.amount, التاريخ: i.date, الوصف: i.description })),
    "المصاريف": data.expenses.map((e) => ({ النوع: e.type, المبلغ: e.amount, التاريخ: e.date, الوصف: e.description })),
    "الواردات": data.income.map((x) => ({ الزبون: x.customerName, المبلغ: x.amount, التاريخ: x.date, الوصف: x.description })),
    "المخزون": data.inventory.map((i) => ({ المادة: i.name, الكمية: i.quantity, الوحدة: i.unit, "حد التنبيه": i.minThreshold })),
    "العملاء": data.customers.map((c) => ({ الاسم: c.name, الهاتف: c.phone, الرصيد: contactBalance(c), ملاحظات: c.notes })),
    "العمال": data.workers.map((c) => ({ الاسم: c.name, الهاتف: c.phone, الرصيد: contactBalance(c), ملاحظات: c.notes })),
    "الموردون": data.suppliers.map((c) => ({ الاسم: c.name, الهاتف: c.phone, الرصيد: contactBalance(c), ملاحظات: c.notes })),
    "الحضور": data.attendance.map((a) => ({ العامل: a.workerName, التاريخ: a.date, الحالة: a.status })),
    "سجلي الشخصي": data.personalLog.map((p) => ({ النوع: p.type, المبلغ: p.amount, التاريخ: p.date, الوصف: p.description })),
  };
  Object.entries(sheets).forEach(([name, rows]) => {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ "لا توجد بيانات": "" }]);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  });
  const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
  const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const filename = "نسخة-احتياطية-المصنع-" + todayISO() + ".xlsx";
  if (downloadsNs) { try { await downloadsNs.save({ filename, data: blob }); } catch (e) { console.error("export failed", e); } }
  else downloadBlob(blob, filename);
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url; link.download = filename; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function useAuth() {
  const [session, setSession] = useState(null);
  const [organization, setOrganization] = useState(null);
  const [loading, setLoading] = useState(hasSupabaseConfig);
  const [error, setError] = useState("");

  const loadOrganization = async (currentSession) => {
    if (!currentSession) { setSession(null); setOrganization(null); setLoading(false); return; }
    setSession(currentSession);
    const organizationName = currentSession.user.user_metadata?.organization_name || "مصنع التكس والسيليكات";
    const organizationCode = currentSession.user.user_metadata?.organization_code || "";
    const { data, error: organizationError } = await supabaseClient.rpc("get_or_create_my_organization", { p_name: organizationName, p_code: organizationCode });
    if (organizationError) setError(organizationError.message);
    else setOrganization(Array.isArray(data) ? data[0] : data);
    setLoading(false);
  };

  useEffect(() => {
    if (!hasSupabaseConfig) return undefined;
    supabaseClient.auth.getSession().then(({ data }) => loadOrganization(data.session));
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, nextSession) => loadOrganization(nextSession));
    return () => listener.subscription.unsubscribe();
  }, []);

  const signIn = (email, password) => supabaseClient.auth.signInWithPassword({ email, password });
  const signUp = (email, password, organizationName, organizationCode) => supabaseClient.auth.signUp({ email, password, options: { data: { organization_name: organizationName, organization_code: organizationCode } } });
  const signOut = () => supabaseClient.auth.signOut();
  return { session, organization, loading, error, signIn, signUp, signOut };
}

function AuthScreen({ auth }) {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [organizationName, setOrganizationName] = useState("مصنع التكس والسيليكات");
  const [organizationCode, setOrganizationCode] = useState("");
  const [message, setMessage] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (!email.trim() || password.length < 6 || (mode === "signup" && !organizationName.trim())) return;
    setBusy(true); setMessage("");
    const result = mode === "signin" ? await auth.signIn(email.trim(), password) : await auth.signUp(email.trim(), password, organizationName.trim(), organizationCode.trim());
    setBusy(false);
    if (result.error) setMessage(result.error.message);
    else if (mode === "signup" && !result.data.session) setMessage("تم إنشاء الحساب. افحص بريدك لتأكيد الحساب ثم سجّل الدخول.");
  };
  return (
    <div dir="rtl" className="min-h-screen flex items-center justify-center p-4" style={{ background: "var(--bg)", fontFamily: "'Cairo', sans-serif" }}>
      <div className="w-full max-w-md rounded-2xl border p-6 shadow-sm" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
        <h1 className="text-xl font-bold mb-1" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>مصنع التكس والسيليكات</h1>
        <p className="text-sm mb-5" style={{ color: "var(--text-muted)" }}>{mode === "signin" ? "سجّل الدخول للوصول إلى بيانات الشركة" : "أنشئ حساب الشركة الأول"}</p>
        <div className="flex flex-col gap-3">
          {mode === "signup" && <>
            <div><FieldLabel>اسم الشركة</FieldLabel><TextInput value={organizationName} onChange={(e) => setOrganizationName(e.target.value)} /></div>
            <div><FieldLabel>رمز الشركة للانضمام (اتركه فارغًا عند إنشاء شركة جديدة)</FieldLabel><TextInput value={organizationCode} onChange={(e) => setOrganizationCode(e.target.value)} /></div>
          </>}
          <div><FieldLabel>البريد الإلكتروني</FieldLabel><TextInput type="email" value={email} onChange={(e) => setEmail(e.target.value)} /></div>
          <div><FieldLabel>كلمة المرور</FieldLabel><TextInput type="password" value={password} onChange={(e) => setPassword(e.target.value)} /></div>
          <PrimaryButton onClick={submit} full disabled={busy || !email.trim() || password.length < 6}>{busy ? "جارٍ التنفيذ..." : mode === "signin" ? "تسجيل الدخول" : "إنشاء الحساب"}</PrimaryButton>
          {message && <div className="text-xs rounded-lg p-2" style={{ background: "var(--warn-bg)", color: "#A34632" }}>{message}</div>}
          <button onClick={() => { setMode(mode === "signin" ? "signup" : "signin"); setMessage(""); }} className="text-xs" style={{ color: "var(--accent)" }}>{mode === "signin" ? "إنشاء حساب جديد" : "لديك حساب؟ سجّل الدخول"}</button>
        </div>
      </div>
    </div>
  );
}

  const [newName, setNewName] = useState("");
  const [newPhone, setNewPhone] = useState("");

  const handleChange = (e) => {
    const val = e.target.value;
    if (val === "__new__") { setAddingNew(true); setNewName(""); setNewPhone(""); return; }
    setAddingNew(false);
    onSelect(val || null);
  };

  const confirmNew = () => {
    if (!newName.trim() || hasDuplicateName(customers, newName)) { notify("اسم العميل موجود مسبقًا أو غير صالح."); return; }
    const c = { id: uid(), name: newName.trim(), phone: newPhone.trim(), notes: "", transactions: [] };
    onCreateNew(c);
    setAddingNew(false);
  };

  return (
    <div className="flex flex-col gap-2">
      <Select value={addingNew ? "__new__" : (customerId || "")} onChange={handleChange}>
        <option value="">-- اختر عميلاً مسجلاً --</option>
        {customers.map((c) => <option key={c.id} value={c.id}>{c.name}{c.phone ? " — " + c.phone : ""}</option>)}
        <option value="__new__">+ إضافة عميل جديد</option>
      </Select>
      {addingNew && (
        <div className="rounded-lg border p-2.5 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
          <TextInput placeholder="اسم العميل الجديد" value={newName} onChange={(e) => setNewName(e.target.value)} />
          <TextInput placeholder="رقم الهاتف (اختياري)" value={newPhone} onChange={(e) => setNewPhone(e.target.value)} />
          <div className="flex gap-2">
            <PrimaryButton onClick={confirmNew} disabled={!newName.trim()}><Icon name="plus" size={14} /> إضافة واختيار</PrimaryButton>
            <GhostButton onClick={() => setAddingNew(false)}>إلغاء</GhostButton>
          </div>
        </div>
      )}
      {!addingNew && customerName && !customerId && (
        <div className="text-xs" style={{ color: "var(--text-muted)" }}>هذا المشروع مرتبط باسم قديم غير مسجّل كعميل بعد: «{customerName}» — اختر عميلاً من القائمة أعلاه لربطه.</div>
      )}
    </div>
  );
}

function NewProjectModal({ onClose, onCreate, customers, upsert }) {
  const [customerId, setCustomerId] = useState("");
  const [phone, setPhone] = useState("");
  const [location, setLocation] = useState("");
  const [productType, setProductType] = useState("تكس");
  const [notes, setNotes] = useState("");
  const [createdCustomer, setCreatedCustomer] = useState(null);

  const handleCreateCustomer = (c) => { upsert("customers", c); setCreatedCustomer(c); setCustomerId(c.id); if (!phone) setPhone(c.phone || ""); };

  const submit = () => {
    const customer = customers.find((c) => c.id === customerId) || createdCustomer;
    if (!customer) return;
    onCreate({ id: uid(), customerId: customer.id, customerName: customer.name, phone: (phone.trim() || customer.phone || ""), location: location.trim(), productType, status: "جديد", dateCreated: todayISO(), notes: notes.trim(), items: [], measurements: [], completedAt: null });
  };
  return (
    <Modal title="مشروع جديد" onClose={onClose}>
      <div className="flex flex-col gap-3">
        <div><FieldLabel>العميل</FieldLabel><CustomerPicker customers={customers} customerId={customerId} onSelect={setCustomerId} onCreateNew={handleCreateCustomer} /></div>
        <div><FieldLabel>رقم هاتف خاص بهذا المشروع (اختياري)</FieldLabel><TextInput value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="اتركه فارغًا لاستخدام هاتف العميل" /></div>
        <div><FieldLabel>موقع المشروع</FieldLabel><TextInput value={location} onChange={(e) => setLocation(e.target.value)} placeholder="الحي / المنطقة" /></div>
        <div><FieldLabel>نوع المنتج المطلوب</FieldLabel><Select value={productType} onChange={(e) => setProductType(e.target.value)}>{PRODUCT_TYPES.map((t) => <option key={t}>{t}</option>)}</Select></div>
        <div><FieldLabel>ملاحظات (اختياري)</FieldLabel><textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2} className="w-full rounded-lg border px-3 py-2 text-sm outline-none" style={{ background: "var(--input-bg)", borderColor: "var(--card-border)", color: "var(--text-strong)" }} /></div>
        <PrimaryButton onClick={submit} full disabled={!customerId}><Icon name="plus" size={16} /> إنشاء المشروع</PrimaryButton>
      </div>
    </Modal>
  );
}

  const totalMeasured = (local.measurements || []).reduce((s, m) => s + Number(m.totalAmount || 0), 0);

  return (
    <Modal title={`مشروع — ${local.customerName}`} onClose={onClose} wide>

        {[{ k: "info", l: "المعلومات", icon: "user" }, { k: "items", l: "المنتجات المرسلة", icon: "truck" }, { k: "measure", l: "المكاييل", icon: "ruler" }].map((t) => (
          <button key={t.k} onClick={() => setSub(t.k)} className="text-xs px-3 py-2 rounded-lg border flex items-center gap-1.5 transition" style={sub === t.k ? { background: "var(--accent)", borderColor: "var(--accent)", color: "white" } : { background: "var(--card-bg)", borderColor: "var(--card-border)", color: "var(--text-body)" }}>

        <div className="flex flex-col gap-3">
          <div>
            <FieldLabel>العميل</FieldLabel>
            <CustomerPicker customers={customers} customerId={local.customerId} customerName={local.customerName}
              onSelect={(id) => { const c = customers.find((x) => x.id === id); update({ customerId: id, customerName: c ? c.name : local.customerName }); }}
              onCreateNew={(c) => { upsertCustomer(c); update({ customerId: c.id, customerName: c.name }); }} />

function ProjectItems({ project, update }) {
  const [direction, setDirection] = useState("إرسال");
  const [name, setName] = useState("");
  const [quantity, setQuantity] = useState("");
  const [unit, setUnit] = useState("كيس");
  const [pendingDelete, setPendingDelete] = useState(null);
  const items = project.items || [];
  const addItem = () => {
    if (!name.trim() || !positiveNumber(quantity)) { notify("أدخل كمية موجبة."); return; }
    const entry = { id: uid(), date: todayISO(), direction, name: name.trim(), quantity: Number(quantity), unit };
    const patch = { items: [entry, ...items] };
    if (project.status === "جديد") patch.status = "قيد التنفيذ";
    update(patch);
    setName(""); setQuantity("");
  };
  const removeItem = (id) => { update({ items: items.filter((i) => i.id !== id) }); setPendingDelete(null); };
  const DIR_ICON = { "إرسال": { icon: "truck", fg: "#4B6350" }, "مرتجع": { icon: "rotate", fg: "#A34632" }, "إضافة": { icon: "plus", fg: "#8A6A32" } };
  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
        <div className="grid grid-cols-3 gap-2">
          <Select value={direction} onChange={(e) => setDirection(e.target.value)}><option value="إرسال">إرسال</option><option value="مرتجع">مرتجع</option><option value="إضافة">إضافة</option></Select>
          <TextInput list="item-suggestions" placeholder="اسم المادة" value={name} onChange={(e) => setName(e.target.value)} />
          <Select value={unit} onChange={(e) => setUnit(e.target.value)}><option>كيس</option><option>لتر</option><option>م</option><option>قطعة</option></Select>
        </div>
        <datalist id="item-suggestions">{ITEM_SUGGESTIONS.map((s) => <option key={s} value={s} />)}</datalist>
        <div className="flex gap-2"><TextInput type="number" placeholder="الكمية" value={quantity} onChange={(e) => setQuantity(e.target.value)} /><PrimaryButton onClick={addItem}><Icon name="plus" size={16} /> تسجيل</PrimaryButton></div>
      </div>
      {items.length === 0 ? <EmptyState icon="truck" title="لا توجد حركات بضاعة مسجّلة" /> : (
        <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
          {items.map((i) => {
            const D = DIR_ICON[i.direction] || DIR_ICON["إرسال"];
            return (
              <div key={i.id} className="flex items-center justify-between py-2.5 gap-2" style={{ borderColor: "var(--divider)" }}>
                <div className="flex items-center gap-2 min-w-0"><Icon name={D.icon} size={14} color={D.fg} /><div className="min-w-0"><div className="text-sm truncate" style={{ color: "var(--text-body)" }}>{i.name}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{i.direction} · {i.date}</div></div></div>
                <div className="flex items-center gap-3 shrink-0">
                  <span className="text-sm font-medium" style={{ color: "var(--text-body)" }}>{fmt(i.quantity)} {i.unit}</span>
                  {pendingDelete === i.id ? <ConfirmInline onConfirm={() => removeItem(i.id)} onCancel={() => setPendingDelete(null)} /> : <button onClick={() => setPendingDelete(i.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={14} /></button>}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ProjectMeasurements({ project, update }) {
  const [workerName, setWorkerName] = useState("");
  const [entries, setEntries] = useState([{ label: "تكس", quantity: "", unitPrice: "", total: "" }]);
  const [pendingDelete, setPendingDelete] = useState(null);
  const measurements = project.measurements || [];
  const setEntry = (idx, patch) => setEntries((prev) => prev.map((e, i) => { if (i !== idx) return e; const next = { ...e, ...patch }; if (next.quantity && next.unitPrice) next.total = String(Number(next.quantity) * Number(next.unitPrice)); return next; }));
  const addRow = () => setEntries((prev) => [...prev, { label: "", quantity: "", unitPrice: "", total: "" }]);
  const removeRow = (idx) => setEntries((prev) => prev.filter((_, i) => i !== idx));
  const sum = entries.reduce((s, e) => s + Number(e.total || 0), 0);
  const submit = () => {
    if (!workerName.trim()) { notify("أدخل اسم العامل."); return; }
    const cleanEntries = entries.filter((e) => e.label.trim() && positiveNumber(e.total) && nonNegativeNumber(e.quantity || 0) && nonNegativeNumber(e.unitPrice || 0)).map((e) => ({ ...e, quantity: Number(e.quantity || 0), unitPrice: Number(e.unitPrice || 0), total: Number(e.total) }));
    if (cleanEntries.length === 0) { notify("أدخل بنود قياس صحيحة وبقيم غير سالبة."); return; }
    const record = { id: uid(), date: todayISO(), workerName: workerName.trim(), entries: cleanEntries, totalAmount: cleanEntries.reduce((s, e) => s + e.total, 0) };
    const patch = { measurements: [record, ...measurements] };
    if (project.status !== "مكتمل") { patch.status = "مكتمل"; patch.completedAt = project.completedAt || todayISO(); }
    update(patch);
    setWorkerName(""); setEntries([{ label: "تكس", quantity: "", unitPrice: "", total: "" }]);
  };
  const removeMeasurement = (id) => { update({ measurements: measurements.filter((m) => m.id !== id) }); setPendingDelete(null); };
  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-xl border p-3 flex flex-col gap-3" style={{ borderColor: "var(--card-border)" }}>
        <div><FieldLabel>اسم العامل (الذي كال العمل)</FieldLabel><TextInput value={workerName} onChange={(e) => setWorkerName(e.target.value)} placeholder="اسم العامل" /></div>
        <div className="flex flex-col gap-2">
          {entries.map((e, idx) => (
            <div key={idx} className="grid grid-cols-12 gap-1.5 items-center">
              <div className="col-span-3"><TextInput list="measure-suggestions" placeholder="البند" value={e.label} onChange={(ev) => setEntry(idx, { label: ev.target.value })} /></div>
              <div className="col-span-3"><TextInput type="number" placeholder="كمية (م)" value={e.quantity} onChange={(ev) => setEntry(idx, { quantity: ev.target.value })} /></div>
              <div className="col-span-3"><TextInput type="number" placeholder="سعر الوحدة" value={e.unitPrice} onChange={(ev) => setEntry(idx, { unitPrice: ev.target.value })} /></div>
              <div className="col-span-2"><TextInput type="number" placeholder="المجموع" value={e.total} onChange={(ev) => setEntry(idx, { total: ev.target.value })} /></div>
              <div className="col-span-1 flex justify-center">{entries.length > 1 && <button onClick={() => removeRow(idx)} style={{ color: "var(--text-muted)" }}><Icon name="x" size={14} /></button>}</div>
            </div>
          ))}
          <datalist id="measure-suggestions">{["تكس", "سيليكات", "مرمات", "جوتن", "نايلو"].map((s) => <option key={s} value={s} />)}</datalist>
          <button onClick={addRow} className="text-xs flex items-center gap-1 self-start" style={{ color: "var(--accent)" }}><Icon name="plus" size={12} /> إضافة بند</button>
        </div>
        <div className="flex items-center justify-between border-t pt-2" style={{ borderColor: "var(--divider)" }}><span className="text-sm" style={{ color: "var(--text-muted)" }}>مجموع هذا الكيل</span><span className="font-bold" style={{ color: "var(--text-strong)" }}>{fmt(sum)}</span></div>
        <PrimaryButton onClick={submit} full><Icon name="plus" size={16} /> حفظ الكيل</PrimaryButton>
      </div>
      {measurements.length === 0 ? <EmptyState icon="ruler" title="لا توجد مكاييل مسجّلة بعد" /> : (
        <div className="flex flex-col gap-2">
          {measurements.map((m) => (
            <div key={m.id} className="rounded-xl border p-3" style={{ borderColor: "var(--card-border)" }}>
              <div className="flex items-center justify-between mb-2">
                <div className="text-sm font-medium flex items-center gap-1.5" style={{ color: "var(--text-body)" }}><Icon name="user" size={13} /> {m.workerName}<span style={{ color: "var(--text-muted)" }}>·</span><span className="font-normal flex items-center gap-1" style={{ color: "var(--text-muted)" }}><Icon name="calendar" size={11} /> {m.date}</span></div>
                {pendingDelete === m.id ? <ConfirmInline onConfirm={() => removeMeasurement(m.id)} onCancel={() => setPendingDelete(null)} /> : <button onClick={() => setPendingDelete(m.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={14} /></button>}
              </div>
              <div className="flex flex-col gap-1">{m.entries.map((e, i) => <div key={i} className="flex items-center justify-between text-xs" style={{ color: "var(--text-muted)" }}><span>{e.label} {e.quantity ? `(${fmt(e.quantity)} × ${fmt(e.unitPrice)})` : ""}</span><span className="font-medium" style={{ color: "var(--text-body)" }}>{fmt(e.total)}</span></div>)}</div>
              <div className="flex items-center justify-between border-t mt-2 pt-2 text-sm" style={{ borderColor: "var(--divider)" }}><span style={{ color: "var(--text-muted)" }}>المجموع</span><span className="font-bold" style={{ color: "var(--text-strong)" }}>{fmt(m.totalAmount)}</span></div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ---------- Invoices (with line items) ----------
function InvoicesTab({ invoices, projects, suppliers, upsert, remove }) {
  const [showAdd, setShowAdd] = useState(false);
  const [typeFilter, setTypeFilter] = useState("الكل");
  const [pendingDelete, setPendingDelete] = useState(null);
  const [expanded, setExpanded] = useState(null);

  const filtered = invoices.filter((i) => typeFilter === "الكل" || i.type === typeFilter);
  const total = filtered.reduce((s, i) => s + Number(i.amount || 0), 0);
  const sorted = [...filtered].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const deleteInvoice = (invoice) => {
    remove("invoices", invoice.id);
    if (invoice.supplierId && invoice.debtTransactionId) {
      const supplier = suppliers.find((s) => s.id === invoice.supplierId);
      if (supplier) upsert("suppliers", { ...supplier, transactions: (supplier.transactions || []).filter((t) => t.id !== invoice.debtTransactionId) });
    }
  };

  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>الفواتير</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>مواد خام، مواد بناء، كهرباء وغيرها — مع تفاصيل البنود</p></div>
        <PrimaryButton onClick={() => setShowAdd(true)}><Icon name="plus" size={16} /> فاتورة جديدة</PrimaryButton>
      </div>
      <div className="flex items-center gap-3 flex-wrap">
        <div className="flex gap-1.5 flex-wrap">{["الكل", ...INVOICE_TYPES].map((t) => <button key={t} onClick={() => setTypeFilter(t)} className="text-xs px-3 py-2 rounded-lg border transition" style={typeFilter === t ? { background: "var(--accent)", borderColor: "var(--accent)", color: "white" } : { background: "var(--card-bg)", borderColor: "var(--card-border)", color: "var(--text-body)" }}>{t}</button>)}</div>
        <div className="mr-auto rounded-lg px-4 py-2 text-sm" style={{ background: "var(--divider)" }}><span className="ml-1" style={{ color: "var(--text-muted)" }}>الإجمالي:</span><span className="font-bold" style={{ color: "var(--text-strong)" }}>{fmt(total)}</span></div>
      </div>
      {sorted.length === 0 ? <EmptyState icon="receipt" title="لا توجد فواتير" sub="أضف أول فاتورة لتبدأ" /> : (
        <div className="rounded-2xl border overflow-hidden" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {sorted.map((inv) => (
              <div key={inv.id} style={{ borderColor: "var(--divider)" }}>
                <button onClick={() => setExpanded(expanded === inv.id ? null : inv.id)} className="w-full flex items-center justify-between px-4 py-3 gap-2 text-right">
                  <div className="min-w-0">
                    <div className="text-sm font-medium truncate flex items-center gap-1.5" style={{ color: "var(--text-body)" }}>
                      {inv.supplierName || "بدون اسم مورّد"} {inv.invoiceNumber && <span className="text-xs font-normal" style={{ color: "var(--text-muted)" }}>#{inv.invoiceNumber}</span>}
                    </div>
                    <div className="text-xs flex items-center gap-1.5 mt-0.5 flex-wrap" style={{ color: "var(--text-muted)" }}>
                      <Badge bg="var(--divider)" fg="#8A6A32">{inv.type}</Badge>{inv.date}
                      {inv.projectId && <span style={{ color: "var(--accent)" }}>· {projects.find((p) => p.id === inv.projectId)?.customerName || ""}</span>}
                      {(inv.items || []).length > 0 && <span>· {inv.items.length} بند</span>}
                    </div>
                  </div>
                  <span className="font-semibold shrink-0" style={{ color: "var(--text-strong)" }}>{fmt(inv.amount)}</span>
                </button>
                {expanded === inv.id && (
                  <div className="px-4 pb-3 flex flex-col gap-2">
                    {inv.description && <div className="text-xs" style={{ color: "var(--text-muted)" }}>{inv.description}</div>}
                    {(inv.items || []).length > 0 && (
                      <div className="rounded-lg p-2.5 flex flex-col gap-1" style={{ background: "var(--divider)" }}>
                        {inv.items.map((it, idx) => (
                          <div key={idx} className="flex items-center justify-between text-xs" style={{ color: "var(--text-body)" }}>
                            <span>{it.name} {it.quantity ? `(${fmt(it.quantity)} ${it.unit || ""} × ${fmt(it.unitPrice)})` : ""}</span>
                            <span className="font-medium">{fmt(it.total)}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    <div className="flex justify-end">
                      {pendingDelete === inv.id ? <ConfirmInline onConfirm={() => { deleteInvoice(inv); setPendingDelete(null); }} onCancel={() => setPendingDelete(null)} /> : <button onClick={() => setPendingDelete(inv.id)} className="text-xs flex items-center gap-1" style={{ color: "#A34632" }}><Icon name="trash" size={13} /> حذف الفاتورة</button>}
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      )}
      {showAdd && <Modal title="فاتورة جديدة" onClose={() => setShowAdd(false)} wide><AddInvoiceForm projects={projects} suppliers={suppliers} upsert={upsert} onAdd={(inv) => { upsert("invoices", inv); setShowAdd(false); }} /></Modal>}
    </div>
  );
}

function AddInvoiceForm({ onAdd, projects, suppliers, upsert }) {
  const [invoiceNumber, setInvoiceNumber] = useState("");
  const [type, setType] = useState(INVOICE_TYPES[0]);
  const [supplierId, setSupplierId] = useState("");
  const [supplierName, setSupplierName] = useState("");
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(todayISO());
  const [description, setDescription] = useState("");
  const [projectId, setProjectId] = useState("");
  const [markAsDebt, setMarkAsDebt] = useState(false);
  const [items, setItems] = useState([{ name: "", quantity: "", unit: "قطعة", unitPrice: "", total: "" }]);

  const setItem = (idx, patch) => setItems((prev) => prev.map((it, i) => { if (i !== idx) return it; const next = { ...it, ...patch }; if (next.quantity && next.unitPrice && nonNegativeNumber(next.quantity) && nonNegativeNumber(next.unitPrice)) next.total = String(Number(next.quantity) * Number(next.unitPrice)); return next; }));
  const addRow = () => setItems((prev) => [...prev, { name: "", quantity: "", unit: "قطعة", unitPrice: "", total: "" }]);
  const removeRow = (idx) => setItems((prev) => prev.filter((_, i) => i !== idx));
  const itemsTotal = items.reduce((s, it) => s + Number(it.total || 0), 0);
  const effectiveAmount = itemsTotal > 0 ? itemsTotal : Number(amount || 0);

  useEffect(() => {
    const sup = suppliers.find((s) => s.id === supplierId);
    if (sup) setSupplierName(sup.name);
  }, [supplierId]);

  const submit = () => {
    if (!positiveNumber(effectiveAmount) || Number(effectiveAmount) < 0) { notify("مبلغ الفاتورة يجب أن يكون موجبًا."); return; }
    const cleanItems = items.filter((it) => it.name.trim() && positiveNumber(it.total) && nonNegativeNumber(it.quantity || 0) && nonNegativeNumber(it.unitPrice || 0)).map((it) => ({ name: it.name.trim(), quantity: Number(it.quantity || 0), unit: it.unit, unitPrice: Number(it.unitPrice || 0), total: Number(it.total) }));
    const debtTransactionId = markAsDebt && supplierId ? uid() : null;
    const inv = {
      id: uid(), invoiceNumber: invoiceNumber.trim(), type, supplierId: supplierId || null, supplierName: supplierName.trim(),
      amount: effectiveAmount, date, description: description.trim(), projectId: type === "مواد بناء" ? (projectId || null) : null, items: cleanItems, debtTransactionId,
    };
    onAdd(inv);
    if (markAsDebt && supplierId) {
      const sup = suppliers.find((s) => s.id === supplierId);
      if (sup) {
        const tx = { id: debtTransactionId, date, type: "debit", amount: effectiveAmount, note: "فاتورة " + (invoiceNumber ? "#" + invoiceNumber : type) };
        upsert("suppliers", { ...sup, transactions: [tx, ...(sup.transactions || [])] });
      }
    }
  };

  return (
    <div className="flex flex-col gap-3">
      <div className="grid sm:grid-cols-2 gap-3">
        <div><FieldLabel>نوع الفاتورة</FieldLabel><Select value={type} onChange={(e) => setType(e.target.value)}>{INVOICE_TYPES.map((t) => <option key={t}>{t}</option>)}</Select></div>
        <div><FieldLabel>رقم الفاتورة (اختياري)</FieldLabel><TextInput value={invoiceNumber} onChange={(e) => setInvoiceNumber(e.target.value)} /></div>
      </div>
      {type === "مواد بناء" && (
        <div><FieldLabel>حمّل التكلفة على مشروع (اختياري)</FieldLabel><Select value={projectId} onChange={(e) => setProjectId(e.target.value)}><option value="">بدون تحديد</option>{projects.map((p) => <option key={p.id} value={p.id}>{p.customerName} — {p.location}</option>)}</Select></div>
      )}
      <div className="grid sm:grid-cols-2 gap-3">
        <div>
          <FieldLabel>المورّد المسجّل (اختياري)</FieldLabel>
          <Select value={supplierId} onChange={(e) => setSupplierId(e.target.value)}><option value="">بدون ربط — اكتب الاسم يدويًا</option>{suppliers.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}</Select>
        </div>
        <div><FieldLabel>اسم المورّد / الجهة</FieldLabel><TextInput value={supplierName} onChange={(e) => setSupplierName(e.target.value)} placeholder="مثال: شركة مواد البناء" /></div>
      </div>
      {supplierId && (
        <label className="flex items-center gap-2 text-xs" style={{ color: "var(--text-body)" }}>
          <input type="checkbox" checked={markAsDebt} onChange={(e) => setMarkAsDebt(e.target.checked)} /> لم يتم الدفع بعد — أضف المبلغ كدين على هذا المورد
        </label>
      )}

      <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
        <FieldLabel>بنود الفاتورة (اختياري — أو أدخل مبلغًا إجماليًا أدناه)</FieldLabel>
        {items.map((it, idx) => (
          <div key={idx} className="grid grid-cols-12 gap-1.5 items-center">
            <div className="col-span-4"><TextInput placeholder="اسم المادة" value={it.name} onChange={(e) => setItem(idx, { name: e.target.value })} /></div>
            <div className="col-span-2"><TextInput type="number" placeholder="كمية" value={it.quantity} onChange={(e) => setItem(idx, { quantity: e.target.value })} /></div>
            <div className="col-span-2"><TextInput placeholder="وحدة" value={it.unit} onChange={(e) => setItem(idx, { unit: e.target.value })} /></div>
            <div className="col-span-2"><TextInput type="number" placeholder="سعر" value={it.unitPrice} onChange={(e) => setItem(idx, { unitPrice: e.target.value })} /></div>
            <div className="col-span-1"><TextInput type="number" placeholder="مجموع" value={it.total} onChange={(e) => setItem(idx, { total: e.target.value })} /></div>
            <div className="col-span-1 flex justify-center">{items.length > 1 && <button onClick={() => removeRow(idx)} style={{ color: "var(--text-muted)" }}><Icon name="x" size={14} /></button>}</div>
          </div>
        ))}
        <button onClick={addRow} className="text-xs flex items-center gap-1 self-start" style={{ color: "var(--accent)" }}><Icon name="plus" size={12} /> إضافة بند</button>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div><FieldLabel>{itemsTotal > 0 ? "المبلغ الإجمالي (محسوب من البنود)" : "المبلغ الإجمالي"}</FieldLabel><TextInput type="number" value={itemsTotal > 0 ? itemsTotal : amount} onChange={(e) => setAmount(e.target.value)} disabled={itemsTotal > 0} /></div>
        <div><FieldLabel>التاريخ</FieldLabel><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div>
      </div>
      <div><FieldLabel>وصف (اختياري)</FieldLabel><TextInput value={description} onChange={(e) => setDescription(e.target.value)} /></div>
      <PrimaryButton onClick={submit} full disabled={!effectiveAmount}><Icon name="plus" size={16} /> حفظ الفاتورة</PrimaryButton>
    </div>
  );
}

      <div className="grid grid-cols-3 gap-3">

      <div className="flex gap-1.5">

        <button onClick={() => setSub("income")} className="text-sm px-4 py-2 rounded-lg border transition" style={sub === "income" ? { background: "var(--accent)", borderColor: "var(--accent)", color: "white" } : { background: "var(--card-bg)", borderColor: "var(--card-border)", color: "var(--text-body)" }}>واردات المشاريع</button>

function ContactDetail({ contact, label, icon, onClose, onSave, onDelete, relatedProjects, onOpenProject }) {
  const [local, setLocal] = useState(contact);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [txType, setTxType] = useState("debit");
  const [txAmount, setTxAmount] = useState("");
  const [txNote, setTxNote] = useState("");
  const [pendingTxDelete, setPendingTxDelete] = useState(null);
  useEffect(() => setLocal(contact), [contact.id]);
  const update = (patch) => { const next = { ...local, ...patch }; setLocal(next); onSave(next); };
  const balance = contactBalance(local);
  const transactions = local.transactions || [];

  const addTx = () => {
    if (!positiveNumber(txAmount) || Number(txAmount) < 0) { notify("مبلغ الحركة يجب أن يكون موجبًا."); return; }
    const tx = { id: uid(), date: todayISO(), type: txType, amount: Number(txAmount), note: txNote.trim() };
    update({ transactions: [tx, ...transactions] });
    setTxAmount(""); setTxNote("");
  };
  const removeTx = (id) => { update({ transactions: transactions.filter((t) => t.id !== id) }); setPendingTxDelete(null); };

  return (
    <Modal title={local.name} onClose={onClose} wide>
      <div className="flex flex-col gap-4">
        <div className="grid sm:grid-cols-2 gap-3">
          <div><FieldLabel>الاسم</FieldLabel><TextInput value={local.name} onChange={(e) => update({ name: e.target.value })} /></div>
          <div><FieldLabel>رقم الهاتف</FieldLabel><TextInput value={local.phone} onChange={(e) => update({ phone: e.target.value })} /></div>
        </div>
        <div><FieldLabel>ملاحظات</FieldLabel><TextInput value={local.notes} onChange={(e) => update({ notes: e.target.value })} /></div>

        <div className="rounded-xl p-3 flex items-center justify-between" style={{ background: balance > 0 ? "var(--warn-bg)" : balance < 0 ? "var(--good-bg)" : "var(--divider)" }}>
          <span className="text-sm" style={{ color: "var(--text-body)" }}>الرصيد الحالي</span>
          <span className="font-bold text-lg" style={{ color: balance > 0 ? "#A34632" : balance < 0 ? "#4B6350" : "var(--text-strong)" }}>
            {balance === 0 ? "لا يوجد" : balance > 0 ? `عليه ${fmt(balance)}` : `له ${fmt(-balance)}`}
          </span>
        </div>

        {relatedProjects != null && (
          <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
            <FieldLabel>مشاريع هذا العميل ({relatedProjects.length})</FieldLabel>
            {relatedProjects.length === 0 ? (
              <div className="text-xs" style={{ color: "var(--text-muted)" }}>لا توجد مشاريع مرتبطة بهذا العميل بعد</div>
            ) : (
              <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
                {relatedProjects.map((p) => {
                  const total = (p.measurements || []).reduce((s, m) => s + Number(m.totalAmount || 0), 0);
                  return (
                    <button key={p.id} onClick={() => { onOpenProject(p.id); onClose(); }} className="flex items-center justify-between py-2 text-right" style={{ borderColor: "var(--divider)" }}>
                      <div><div className="text-sm" style={{ color: "var(--text-body)" }}>{p.location || "بدون موقع"}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{p.dateCreated} · {p.productType}</div></div>
                      <div className="flex items-center gap-2">
                        <Badge bg={STATUS_COLOR[p.status].bg} fg={STATUS_COLOR[p.status].fg}>{p.status}</Badge>
                        <span className="text-sm font-medium" style={{ color: "var(--text-strong)" }}>{fmt(total)}</span>
                      </div>
                    </button>
                  );
                })}
              </div>
            )}
          </div>
        )}

        <div className="rounded-xl border p-3 flex flex-col gap-2" style={{ borderColor: "var(--card-border)" }}>
          <FieldLabel>تسجيل حركة جديدة</FieldLabel>
          <div className="grid grid-cols-2 gap-2">
            <Select value={txType} onChange={(e) => setTxType(e.target.value)}><option value="debit">زيادة دين عليه</option><option value="credit">تسديد / دفعة منه</option></Select>
            <TextInput type="number" placeholder="المبلغ" value={txAmount} onChange={(e) => setTxAmount(e.target.value)} />
          </div>
          <TextInput placeholder="ملاحظة (اختياري)" value={txNote} onChange={(e) => setTxNote(e.target.value)} />
          <PrimaryButton onClick={addTx} full disabled={!txAmount}><Icon name="plus" size={16} /> تسجيل الحركة</PrimaryButton>
        </div>

        {transactions.length === 0 ? <EmptyState icon={icon} title="لا توجد حركات مسجّلة بعد" /> : (
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {transactions.map((t) => (
              <div key={t.id} className="flex items-center justify-between py-2.5" style={{ borderColor: "var(--divider)" }}>
                <div className="flex items-center gap-2">
                  <Icon name={t.type === "debit" ? "trendUp" : "trendDown"} size={14} color={t.type === "debit" ? "#A34632" : "#4B6350"} />
                  <div><div className="text-sm" style={{ color: "var(--text-body)" }}>{t.note || (t.type === "debit" ? "زيادة دين" : "تسديد")}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{t.date}</div></div>
                </div>
                <div className="flex items-center gap-3">
                  <span className="font-medium" style={{ color: t.type === "debit" ? "#A34632" : "#4B6350" }}>{t.type === "debit" ? "+" : "−"}{fmt(t.amount)}</span>
                  {pendingTxDelete === t.id ? <ConfirmInline onConfirm={() => removeTx(t.id)} onCancel={() => setPendingTxDelete(null)} /> : <button onClick={() => setPendingTxDelete(t.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={13} /></button>}
                </div>
              </div>
            ))}
          </div>
        )}

        <div className="pt-3 border-t flex justify-end" style={{ borderColor: "var(--card-border)" }}>
          {confirmDelete ? <ConfirmInline label="حذف نهائيًا؟" onConfirm={onDelete} onCancel={() => setConfirmDelete(false)} /> : <button onClick={() => setConfirmDelete(true)} className="text-xs flex items-center gap-1" style={{ color: "#A34632" }}><Icon name="trash" size={13} /> حذف</button>}
        </div>
      </div>
    </Modal>
  );
}

// ---------- Reports ----------
function ReportsTab({ month, setMonth, projects, invoices, expenses, income, attendance, workers, downloadsNs }) {
  const inMonth = (arr, field) => arr.filter((x) => monthKey(x[field || "date"]) === month);
  const mIncome = inMonth(income);
  const mExpenses = inMonth(expenses);
  const mInvoices = inMonth(invoices);
  const totalIncome = mIncome.reduce((s, x) => s + Number(x.amount || 0), 0);
  const totalExpenses = mExpenses.reduce((s, x) => s + Number(x.amount || 0), 0);
  const totalInvoices = mInvoices.reduce((s, x) => s + Number(x.amount || 0), 0);
  const net = totalIncome - totalExpenses - totalInvoices;

  const completedProjects = projects.filter((p) => p.completedAt && monthKey(p.completedAt) === month);
  const newProjects = projects.filter((p) => monthKey(p.dateCreated) === month);

  const expenseByType = EXPENSE_TYPES.map((t) => ({ label: t, total: mExpenses.filter((e) => e.type === t).reduce((s, e) => s + Number(e.amount || 0), 0) })).filter((r) => r.total > 0);
  const invoiceByType = INVOICE_TYPES.map((t) => ({ label: t, total: mInvoices.filter((i) => i.type === t).reduce((s, i) => s + Number(i.amount || 0), 0) })).filter((r) => r.total > 0);

  const monthAttendance = attendance.filter((a) => monthKey(a.date) === month);
  const attSummary = workers.map((w) => ({
    name: w.name,
    present: monthAttendance.filter((a) => a.workerId === w.id && a.status === "حاضر").length,
    half: monthAttendance.filter((a) => a.workerId === w.id && a.status === "نصف يوم").length,
    absent: monthAttendance.filter((a) => a.workerId === w.id && a.status === "غائب").length,
  })).filter((s) => s.present + s.half + s.absent > 0);

  const exportMonth = async () => {
    if (!window.XLSX) { notify("ميزة التصدير غير متاحة هنا حاليًا."); return; }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ الشهر: month, الواردات: totalIncome, المصاريف: totalExpenses, الفواتير: totalInvoices, الصافي: net }]), "ملخص");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mIncome.map((x) => ({ الزبون: x.customerName, المبلغ: x.amount, التاريخ: x.date }))), "الواردات");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mExpenses.map((x) => ({ النوع: x.type, المبلغ: x.amount, التاريخ: x.date }))), "المصاريف");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mInvoices.map((x) => ({ النوع: x.type, المورد: x.supplierName, المبلغ: x.amount, التاريخ: x.date }))), "الفواتير");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(completedProjects.map((p) => ({ الزبون: p.customerName, الموقع: p.location, "تاريخ المشروع": p.dateCreated, "تاريخ الإكمال": p.completedAt, الإجمالي: (p.measurements || []).reduce((s, m) => s + Number(m.totalAmount || 0), 0) }))), "مشاريع مكتملة");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(workers.map((w) => { const records = monthAttendance.filter((a) => a.workerId === w.id); return { العامل: w.name, حاضر: records.filter((a) => a.status === "حاضر").length, "نصف يوم": records.filter((a) => a.status === "نصف يوم").length, غائب: records.filter((a) => a.status === "غائب").length }; })), "حضور العمال");
    const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const filename = `تقرير-${month}.xlsx`;
    if (downloadsNs) { try { await downloadsNs.save({ filename, data: blob }); } catch (e) { console.error(e); } }
    else downloadBlob(blob, filename);
  };

  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>التقارير الشهرية</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>ملخص شامل لأي شهر تختاره — الصافي هنا = الواردات − المصاريف − الفواتير</p></div>
        <div className="flex items-center gap-2">
          <TextInput type="month" value={month} onChange={(e) => setMonth(e.target.value)} className="max-w-[170px]" />
          <PrimaryButton onClick={exportMonth}><Icon name="download" size={16} /> تصدير التقرير</PrimaryButton>
        </div>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard icon="trendUp" label="واردات الشهر" value={fmt(totalIncome)} accent="#4B6350" />
        <StatCard icon="trendDown" label="مصاريف الشهر" value={fmt(totalExpenses)} accent="#A34632" />
        <StatCard icon="receipt" label="فواتير الشهر" value={fmt(totalInvoices)} accent="#8A6A32" />
        <StatCard icon={net >= 0 ? "trendUp" : "trendDown"} label="الصافي" value={fmt(net)} accent={net >= 0 ? "#4B6350" : "#A34632"} />
      </div>

      <div className="grid lg:grid-cols-2 gap-4">
        <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>المصاريف حسب النوع</h3>
          {expenseByType.length === 0 ? <EmptyState icon="wallet" title="لا توجد مصاريف هذا الشهر" /> : <BarBreakdown rows={expenseByType} />}
        </div>
        <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>الفواتير حسب النوع</h3>
          {invoiceByType.length === 0 ? <EmptyState icon="receipt" title="لا توجد فواتير هذا الشهر" /> : <BarBreakdown rows={invoiceByType} />}
        </div>
      </div>

      <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
        <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>مشاريع اكتملت هذا الشهر ({completedProjects.length})</h3>
        {completedProjects.length === 0 ? <EmptyState icon="factory" title="لا توجد مشاريع مكتملة هذا الشهر" /> : (
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {completedProjects.map((p) => (
              <div key={p.id} className="flex items-center justify-between py-2.5" style={{ borderColor: "var(--divider)" }}>
                <div><div className="text-sm" style={{ color: "var(--text-body)" }}>{p.customerName}</div><div className="text-xs" style={{ color: "var(--text-muted)" }}>{p.location}</div></div>
                <span className="font-semibold" style={{ color: "var(--text-strong)" }}>{fmt((p.measurements || []).reduce((s, m) => s + Number(m.totalAmount || 0), 0))}</span>
              </div>
            ))}
          </div>
        )}
        <div className="text-xs mt-3" style={{ color: "var(--text-muted)" }}>مشاريع جديدة بدأت هذا الشهر: {newProjects.length}</div>
      </div>

      {attSummary.length > 0 && (
        <div className="rounded-2xl border p-4" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <h3 className="font-semibold text-sm mb-3" style={{ color: "var(--text-body)" }}>أيام حضور العمال هذا الشهر</h3>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {attSummary.map((s) => <div key={s.name} className="flex items-center justify-between py-2 text-sm" style={{ color: "var(--text-body)", borderColor: "var(--divider)" }}><span>{s.name}</span><span className="flex items-center gap-2"><Badge bg="var(--good-bg)" fg="#4B6350">حاضر {s.present}</Badge><Badge bg="var(--warn-bg)" fg="#8A6A32">نصف يوم {s.half}</Badge><Badge bg="var(--divider)" fg="var(--text-muted)">غائب {s.absent}</Badge></span></div>)}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Personal log ----------
function PersonalLogTab({ data, upsert, remove }) {
  const [showAdd, setShowAdd] = useState(false);
  const [pendingDelete, setPendingDelete] = useState(null);
  const sorted = [...data].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const totalIn = data.filter((x) => x.type === "واصل").reduce((s, x) => s + Number(x.amount || 0), 0);
  const totalOut = data.filter((x) => x.type === "مصروف").reduce((s, x) => s + Number(x.amount || 0), 0);
  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>سجلي الشخصي</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>ما وصلك من مبالغ وما صرفته — سجل خاص بك</p></div>
        <PrimaryButton onClick={() => setShowAdd(true)}><Icon name="plus" size={16} /> تسجيل حركة</PrimaryButton>
      </div>
      <div className="grid grid-cols-3 gap-3">
        <StatCard icon="trendUp" label="إجمالي الواصل" value={fmt(totalIn)} accent="#4B6350" />
        <StatCard icon="trendDown" label="إجمالي المصروف" value={fmt(totalOut)} accent="#A34632" />
        <StatCard icon="wallet" label="المتبقي بيدي" value={fmt(totalIn - totalOut)} accent="#8A6A32" />
      </div>
      {sorted.length === 0 ? <EmptyState icon="wallet" title="لا توجد حركات مسجّلة بعد" /> : (
        <div className="rounded-2xl border overflow-hidden" style={{ background: "var(--card-bg)", borderColor: "var(--card-border)" }}>
          <div className="flex flex-col divide-y" style={{ borderColor: "var(--divider)" }}>
            {sorted.map((x) => (
              <div key={x.id} className="flex items-center justify-between px-4 py-3 gap-2" style={{ borderColor: "var(--divider)" }}>
                <div className="min-w-0"><div className="text-sm font-medium" style={{ color: "var(--text-body)" }}>{x.type}</div><div className="text-xs mt-0.5" style={{ color: "var(--text-muted)" }}>{x.date} {x.description ? "· " + x.description : ""}</div></div>
                <div className="flex items-center gap-3 shrink-0">
                  <span className="font-semibold" style={{ color: x.type === "واصل" ? "#4B6350" : "#A34632" }}>{x.type === "واصل" ? "+" : "−"}{fmt(x.amount)}</span>
                  {pendingDelete === x.id ? <ConfirmInline onConfirm={() => { remove("personalLog", x.id); setPendingDelete(null); }} onCancel={() => setPendingDelete(null)} /> : <button onClick={() => setPendingDelete(x.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={14} /></button>}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
      {showAdd && <Modal title="تسجيل حركة" onClose={() => setShowAdd(false)}><AddPersonalForm onAdd={(e) => { upsert("personalLog", e); setShowAdd(false); }} /></Modal>}
    </div>
  );
}
function AddPersonalForm({ onAdd }) {
  const [type, setType] = useState("واصل");
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(todayISO());
  const [description, setDescription] = useState("");
  const submit = () => { if (!positiveNumber(amount) || Number(amount) < 0) { notify("المبلغ يجب أن يكون موجبًا."); return; } onAdd({ id: uid(), type, amount: Number(amount), date, description: description.trim() }); };
  return (
    <div className="flex flex-col gap-3">
      <div><FieldLabel>النوع</FieldLabel><Select value={type} onChange={(e) => setType(e.target.value)}><option value="واصل">واصل (مبلغ استلمته)</option><option value="مصروف">مصروف (صرفته)</option></Select></div>
      <div className="grid grid-cols-2 gap-3"><div><FieldLabel>المبلغ</FieldLabel><TextInput type="number" value={amount} onChange={(e) => setAmount(e.target.value)} /></div><div><FieldLabel>التاريخ</FieldLabel><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div></div>
      <div><FieldLabel>وصف (اختياري)</FieldLabel><TextInput value={description} onChange={(e) => setDescription(e.target.value)} /></div>
      <PrimaryButton onClick={submit} full disabled={!amount}><Icon name="plus" size={16} /> حفظ</PrimaryButton>
    </div>
  );
}

// ---------- Inventory ----------
function InventoryTab({ inventory, upsert, remove }) {
  const [showAdd, setShowAdd] = useState(false);
  const [pendingDelete, setPendingDelete] = useState(null);
  const adjust = (item, delta) => {
    const current = Number(item.quantity);
    if (!Number.isFinite(current)) return;
    upsert("inventory", { ...item, quantity: Math.max(0, current + delta) });
  };
  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div><h1 className="text-xl font-bold" style={{ fontFamily: "'El Messiri', sans-serif", color: "var(--text-strong)" }}>المخزون</h1><p className="text-sm mt-0.5" style={{ color: "var(--text-muted)" }}>بضاعة مخزّنة في المكتب ومتابعة نقصها</p></div>
        <PrimaryButton onClick={() => setShowAdd(true)}><Icon name="plus" size={16} /> مادة جديدة</PrimaryButton>
      </div>
      {inventory.length === 0 ? <EmptyState icon="package" title="لا توجد مواد مسجّلة في المخزون" /> : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {inventory.map((i) => {
            const low = Number(i.quantity) <= Number(i.minThreshold || 0);
            return (
              <div key={i.id} className="rounded-2xl border p-4 flex flex-col gap-3" style={{ borderColor: low ? "var(--warn-border)" : "var(--card-border)", background: low ? "var(--warn-bg)" : "var(--card-bg)" }}>
                <div className="flex items-start justify-between">
                  <div><div className="font-medium" style={{ color: "var(--text-strong)" }}>{i.name}</div>{low && <div className="text-xs flex items-center gap-1 mt-0.5" style={{ color: "#A34632" }}><Icon name="alert" size={11} /> منخفض</div>}</div>
                  {pendingDelete === i.id ? <ConfirmInline onConfirm={() => { remove("inventory", i.id); setPendingDelete(null); }} onCancel={() => setPendingDelete(null)} /> : <button onClick={() => setPendingDelete(i.id)} style={{ color: "var(--text-muted)" }}><Icon name="trash" size={14} /></button>}
                </div>
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <button onClick={() => adjust(i, -1)} className="w-7 h-7 rounded-lg border flex items-center justify-center" style={{ borderColor: "var(--card-border)", color: "var(--text-body)" }}>−</button>
                    <span className="text-lg font-bold min-w-[50px] text-center" style={{ color: "var(--text-strong)" }}>{fmt(i.quantity)}</span>
                    <button onClick={() => adjust(i, 1)} className="w-7 h-7 rounded-lg border flex items-center justify-center" style={{ borderColor: "var(--card-border)", color: "var(--text-body)" }}>+</button>
                  </div>
                  <span className="text-xs" style={{ color: "var(--text-muted)" }}>{i.unit}</span>
                </div>
                <div className="text-xs" style={{ color: "var(--text-muted)" }}>الحد الأدنى: {fmt(i.minThreshold)} {i.unit}</div>
              </div>
            );
          })}
        </div>
      )}
      {showAdd && <Modal title="مادة جديدة في المخزون" onClose={() => setShowAdd(false)}><AddInventoryForm existing={inventory} onAdd={(item) => { upsert("inventory", item); setShowAdd(false); }} /></Modal>}
    </div>
  );
}
function AddInventoryForm({ onAdd, existing = [] }) {
  const [name, setName] = useState("");
  const [quantity, setQuantity] = useState("");
  const [unit, setUnit] = useState("كيس");
  const [minThreshold, setMinThreshold] = useState("");
  const submit = () => {
    if (!name.trim() || !nonNegativeNumber(quantity || 0) || !nonNegativeNumber(minThreshold || 0)) { notify("أدخل كميات غير سالبة."); return; }
    if (hasDuplicateName(existing, name)) { notify("هذه المادة موجودة مسبقًا."); return; }
    onAdd({ id: uid(), name: name.trim(), quantity: Number(quantity || 0), unit, minThreshold: Number(minThreshold || 0) });
  };
  return (
    <div className="flex flex-col gap-3">
      <div><FieldLabel>اسم المادة</FieldLabel><TextInput list="item-suggestions-2" value={name} onChange={(e) => setName(e.target.value)} /><datalist id="item-suggestions-2">{ITEM_SUGGESTIONS.map((s) => <option key={s} value={s} />)}</datalist></div>
      <div className="grid grid-cols-2 gap-3"><div><FieldLabel>الكمية الحالية</FieldLabel><TextInput type="number" value={quantity} onChange={(e) => setQuantity(e.target.value)} /></div><div><FieldLabel>الوحدة</FieldLabel><Select value={unit} onChange={(e) => setUnit(e.target.value)}><option>كيس</option><option>لتر</option><option>م</option><option>قطعة</option></Select></div></div>
      <div><FieldLabel>حد التنبيه عند النقص</FieldLabel><TextInput type="number" value={minThreshold} onChange={(e) => setMinThreshold(e.target.value)} /></div>
      <PrimaryButton onClick={submit} full disabled={!name.trim()}><Icon name="plus" size={16} /> إضافة إلى المخزون</PrimaryButton>
    </div>
  );
}

function App() {
  const auth = useAuth();
  if (!hasSupabaseConfig) return <><ToastHost /><FactoryApp /></>;
  if (auth.loading) return <><ToastHost /><div dir="rtl" className="min-h-screen flex items-center justify-center text-sm" style={{ background: "var(--bg)", color: "var(--text-muted)", fontFamily: "'Cairo', sans-serif" }}>جارٍ التحقق من الحساب...</div></>;
  if (!auth.session) return <><ToastHost /><AuthScreen auth={auth} /></>;
  if (auth.error || !auth.organization) return <><ToastHost /><div dir="rtl" className="min-h-screen flex items-center justify-center p-4 text-sm" style={{ background: "var(--bg)", color: "#A34632", fontFamily: "'Cairo', sans-serif" }}>تعذر تجهيز مساحة الشركة: {auth.error || "لم يتم العثور على المنظمة"}</div></>;
  return <><ToastHost /><FactoryApp organizationId={auth.organization.organization_id || auth.organization.id} organizationCode={auth.organization.invite_code} email={auth.session.user.email} onSignOut={auth.signOut} /></>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
